[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "opspilot-common"
version = "0.1.0"
description = "Shared auth, logging and error handling for OpsPilot services"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "pyjwt>=2.9,<3",
    "pydantic-settings>=2.4,<3",
]

[tool.setuptools]
packages = ["opspilot_common"]
